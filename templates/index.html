<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Status</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem 4rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.85;
            margin-bottom: 2rem;
        }
        .badge {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: #10b981;
            color: #ffffff;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Hello, CI/CD! - V2</h1>
        <p>Your Flask application is running perfectly.</p>
        <div class="badge">GitHub Actions Ready</div>
    </div>
</body>
</html>
